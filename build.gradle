    tss4jNative = { classifier ->
        "org.exploit:tss4j-natives:${tss4jNativesVersion}:${classifier}@jar"
    }
}

def configurePom = { MavenPublication publication, Project p ->
    def metadata = rootProject.ext.anvilProjectPom[p.path]

    publication.pom {
        name = metadata.name
        description = metadata.description
        url = rootProject.ext.anvilPomUrl

        licenses {
            license {
                name = 'Apache License 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }

        developers {
            developer {
                id = rootProject.ext.anvilDeveloperId
                name = rootProject.ext.anvilDeveloperName
                email = rootProject.ext.anvilDeveloperEmail
            }
        }

        scm {
            connection = rootProject.ext.anvilScmConnection
            developerConnection = rootProject.ext.anvilScmDeveloperConnection
            url = rootProject.ext.anvilScmUrl
        }
    }
}

def configureMavenCentralSnapshotRepository = { repository ->
    repository.name = 'MavenCentralSnapshots'
    repository.url = rootProject.uri(rootProject.ext.anvilSnapshotRepositoryUrl)
    repository.mavenContent {
        snapshotsOnly()
    }

    if (rootProject.ext.anvilSnapshotRepositoryUsername && rootProject.ext.anvilSnapshotRepositoryPassword) {
        repository.credentials {
            username = rootProject.ext.anvilSnapshotRepositoryUsername.toString()
            password = rootProject.ext.anvilSnapshotRepositoryPassword.toString()
        }
    }
}

mavenCentral {
    repoDir = layout.buildDirectory.dir('repos/central-bundles')
    authToken = centralMavenToken
    publishingType = 'USER_MANAGED'
}

tasks.register('validateMavenCentralSnapshotPublication') {
    group = 'publishing'
    description = 'Validates Maven Central snapshot publishing configuration.'

    doLast {
        if (!version.toString().endsWith('-SNAPSHOT')) {
            throw new GradleException("Snapshot publication requires -PreleaseVersion=<version>-SNAPSHOT; current version is ${version}.")
        }

        if (!rootProject.ext.anvilSnapshotRepositoryUsername || !rootProject.ext.anvilSnapshotRepositoryPassword) {
            throw new GradleException(
                    'Missing Maven Central snapshot credentials. Set snapshotRepositoryUsername/snapshotRepositoryPassword ' +
                            'or compatible Maven Central/Sonatype username/password properties or environment variables.'
            )
        }
    }
}

allprojects {
    group = rootProject.group
    version = rootProject.version

    repositories {
        mavenCentral()
    }
}

configure(rootProject.ext.anvilJavaProjects.collect { project(it) }) {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }

        withSourcesJar()
        withJavadocJar()
    }

    dependencies {
        testImplementation platform("org.junit:junit-bom:${rootProject.ext.junitVersion}")
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += '--enable-preview'
    }

    tasks.withType(Javadoc).configureEach {
        failOnError = false

        options.encoding = 'UTF-8'
        options.addStringOption('Xdoclint:none', '-quiet')
        options.addBooleanOption('html5', true)
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        jvmArgs '--enable-preview', '--enable-native-access=ALL-UNNAMED'
    }

    tasks.withType(Jar).configureEach {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    publishing {
        publications {
            maven(MavenPublication) {
                from components.java
                configurePom(delegate, project)
            }
        }

        repositories {
            maven {
                name = 'CentralBundle'
                url = rootProject.layout.buildDirectory.dir('repos/central-bundles')
            }
            maven(configureMavenCentralSnapshotRepository)
        }
    }

    tasks.matching {
        it.name == 'publishAllPublicationsToMavenCentralSnapshotsRepository' ||
                it.name == 'publishMavenPublicationToMavenCentralSnapshotsRepository'
    }.configureEach {
        dependsOn rootProject.tasks.named('validateMavenCentralSnapshotPublication')
    }

    signing {
        if (signingKey) {
            def decodedSigningKey = new String(Base64.mimeDecoder.decode(signingKey.toString()), "UTF-8")

            if (!decodedSigningKey.startsWith("-----BEGIN PGP PRIVATE KEY BLOCK-----")) {
                throw new GradleException("signingKey is not base64 of an armored private key")
            }

            useInMemoryPgpKeys(decodedSigningKey, signingPassword?.toString())
        }

        required {
            gradle.taskGraph.allTasks.any { task ->
                task.name.toLowerCase(Locale.ROOT).contains('publish') ||
                        task.name.toLowerCase(Locale.ROOT).contains('sign')
            }
        }

        sign publishing.publications.maven
    }
}

project(':bom') {
    apply plugin: 'java-platform'
    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    javaPlatform {
        allowDependencies()
    }

    dependencies {
        constraints {
            rootProject.ext.anvilJavaProjects.each { projectPath ->
                api project(projectPath)
            }
        }
    }

    publishing {
        publications {
            maven(MavenPublication) {
                from components.javaPlatform
                configurePom(delegate, project)
            }
        }

        repositories {
            maven {
                name = 'CentralBundle'
                url = rootProject.layout.buildDirectory.dir('repos/central-bundles')
            }
            maven(configureMavenCentralSnapshotRepository)
        }
    }

    tasks.matching {
        it.name == 'publishAllPublicationsToMavenCentralSnapshotsRepository' ||
                it.name == 'publishMavenPublicationToMavenCentralSnapshotsRepository'
    }.configureEach {
        dependsOn rootProject.tasks.named('validateMavenCentralSnapshotPublication')
    }

    signing {
        if (signingKey) {
            def decodedSigningKey = new String(Base64.mimeDecoder.decode(signingKey.toString()), "UTF-8")

            if (!decodedSigningKey.startsWith("-----BEGIN PGP PRIVATE KEY BLOCK-----")) {
                throw new GradleException("signingKey is not base64 of an armored private key")
            }

            useInMemoryPgpKeys(decodedSigningKey, signingPassword?.toString())
        }

        required {
            gradle.taskGraph.allTasks.any { task ->
                task.name.toLowerCase(Locale.ROOT).contains('publish') ||
                        task.name.toLowerCase(Locale.ROOT).contains('sign')
            }
        }

        sign publishing.publications.maven
    }
}

tasks.register('publishAllToCentralBundle') {
    group = 'publishing'
    description = 'Publishes every Anvil publication into build/repos/central-bundles.'
    dependsOn((rootProject.ext.anvilJavaProjects + [':bom']).collect {
        "${it}:publishAllPublicationsToCentralBundleRepository"
    })
}

tasks.register('publishAllToMavenCentralPortal') {
    group = 'publishing'
    description = 'Uploads every Anvil publication bundle to Maven Central Portal.'
    dependsOn(tasks.named('publishToMavenCentralPortal'))
}

tasks.register('publishAllToMavenCentralSnapshots') {
    group = 'publishing'
    description = 'Publishes every Anvil -SNAPSHOT publication to Maven Central Portal snapshots.'
    dependsOn((rootProject.ext.anvilJavaProjects + [':bom']).collect {
        "${it}:publishAllPublicationsToMavenCentralSnapshotsRepository"
    })
}

tasks.register('publishAllToSnapshotRepository') {
    group = 'publishing'
    description = 'Alias for publishAllToMavenCentralSnapshots.'
    dependsOn(tasks.named('publishAllToMavenCentralSnapshots'))
}

tasks.register('publishAllToMavenLocal') {
    group = 'publishing'
    description = 'Publishes every Anvil publication to the local Maven repository.'
    dependsOn((rootProject.ext.anvilJavaProjects + [':bom']).collect {
        "${it}:publishToMavenLocal"
    })
}

tasks.named('zipBundleForUpload') {
    dependsOn(tasks.named('publishAllToCentralBundle'))
}
